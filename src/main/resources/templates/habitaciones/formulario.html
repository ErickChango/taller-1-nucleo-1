<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Habitación</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a th:href="@{/}">🏠 Inicio</a>
            <a th:href="@{/habitaciones}">🛏️ Habitaciones</a>
            <a th:href="@{/huespedes}">👤 Huéspedes</a>
            <a th:href="@{/reservas}">📅 Reservas</a>
        </nav>

        <h1 th:text="${habitacion.id != null ? '✏️ Editar Habitación' : '➕ Nueva Habitación'}">Habitación</h1>

        <form th:action="@{/habitaciones/guardar}" th:object="${habitacion}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="numeroHabitacion">Número de Habitación:</label>
                <input type="text" id="numeroHabitacion" th:field="*{numeroHabitacion}" required>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Habitación:</label>
                <select id="tipo" th:field="*{tipo}" required>
                    <option value="">Seleccione un tipo</option>
                    <option value="Simple">Simple</option>
                    <option value="Doble">Doble</option>
                    <option value="Triple">Triple</option>
                    <option value="Suite">Suite</option>
                    <option value="Presidencial">Presidencial</option>
                </select>
            </div>

            <div class="form-group">
                <label for="capacidad">Capacidad (personas):</label>
                <input type="number" id="capacidad" th:field="*{capacidad}" min="1" required>
            </div>

            <div class="form-group">
                <label for="precioPorNoche">Precio por Noche ($):</label>
                <input type="number" id="precioPorNoche" th:field="*{precioPorNoche}" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="disponible">Disponibilidad:</label>
                <select id="disponible" th:field="*{disponible}">
                    <option value="true">Disponible</option>
                    <option value="false">No Disponible</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="4"></textarea>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <a th:href="@{/habitaciones}" class="btn btn-danger">❌ Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
